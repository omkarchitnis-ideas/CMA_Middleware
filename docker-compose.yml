services:
  cma-middleware:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: cma-middleware
    restart: unless-stopped
    ports:
      - "8555:8555"
      - "6080:6080"
    volumes:
      - ./api_gateway.db:/app/api_gateway.db
      - ./edge_profile:/app/edge_profile
    env_file:
      - .env
    networks:
      - cma_net

  cma-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: cma-mcp-server
    restart: unless-stopped
    ports:
      - "8556:8556"
    volumes:
      - ./api_gateway.db:/app/api_gateway.db:ro
      - ./chains_cache.json:/app/chains_cache.json:ro
    environment:
      - CMA_GATEWAY_URL=http://cma-middleware:8555
      - CMA_API_KEY=cma_6Z2AkhS4ux70JGlTa4mzGeWVVhaQRGWu
      - MCP_PORT=8556
      - MCP_HOST=0.0.0.0
    depends_on:
      - cma-middleware
    networks:
      - cma_net

networks:
  cma_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.200.3.0/24
